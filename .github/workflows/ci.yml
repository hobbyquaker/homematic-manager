name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The addon runs on busybox `ash` on a CCU with no package manager and a read-only root: a
      # syntax error in `rc.d/hmm` does not fail loudly, the addon simply never starts. `sh -n`
      # plus shellcheck is the only check those files get, since nothing in the test suite executes
      # them on a CCU. shellcheck ships with the runner image; the variable makes a runner that
      # stopped shipping it a failure rather than a green check that tested nothing.
      - run: npm run lint:sh
        env:
          LINT_SH_REQUIRE_SHELLCHECK: 1

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # D-23: the component tests of `packages/ui` run in a real chromium, so every job that runs
      # them needs the browser. `--with-deps` installs the shared libraries the runner image does
      # not have; the download is ~120 MB and takes about 20 s.
      - run: npx playwright install --with-deps chromium
      # hm-simulator is a devDependency since 1.0.0, so `npm ci` above installed it.
      # `SIMULATOR_REQUIRED: 1` turns the `describe.skipIf` of every simulator suite into a failure:
      # skipping keeps a checkout without the package green, but a whole suite must never vanish
      # from a green CI run.
      - run: npm run typecheck
      - run: npm test
        env:
          SIMULATOR_REQUIRED: 1
      - run: npm run test:cov
        env:
          SIMULATOR_REQUIRED: 1
      # D-12: the coverage report is uploaded for review, it never fails the run.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: error

  e2e:
    # The web host, the real backend and an in-process hm-simulator, driven through chromium: one
    # spec per workflow of the feature inventory (docs/analysis-2026-09.md 2.1). Its own job, not a
    # step of `test`, because it needs `npm run build` - the host serves the *built* UI bundle, and
    # `npm test` never builds one.
    name: End-to-end (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # `SIMULATOR_REQUIRED: 1` makes a missing hm-simulator a failure rather than 20 silent skips.
      # `c8` around the whole Playwright run: the workers inherit NODE_V8_COVERAGE, and the build's
      # source maps put the result back on the TypeScript sources. This is the only coverage the
      # backend and the web host get from a real browser over a real socket.
      - run: npm run test:e2e:cov
        env:
          SIMULATOR_REQUIRED: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-e2e
          path: coverage-e2e/
          if-no-files-found: warn
      - name: The traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    # D-12: one report out of the two runs that produce coverage, with the per-package targets shown
    # and **never** enforced. Its own job because the two runs are two jobs; `if: always()` because
    # a red test job is exactly when the number is interesting; and no `npm ci`, because the merge
    # script uses nothing but Node's own modules.
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-node-24
          path: coverage
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-e2e
          path: coverage-e2e
      # Prints the table and writes it to the job summary. Exits 0 whatever it finds, including
      # nothing at all - the point is that a human reads it, not that a bot blocks on it.
      - run: npm run coverage:report
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: coverage/merged.lcov
          if-no-files-found: warn

  npm-package:
    # D-24: `apps/web` is published to npm as its own deliverable, and what goes into that tarball
    # is decided by its `files` list plus `scripts/prepack.mjs` - neither of which any test touches.
    # So the package is really packed on every push: a `files` entry that stopped matching, a
    # missing built UI, or an SBOM step (D-27) that broke are found here and not at a tag.
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run -w apps/web
      - name: SBOM of the tarball (D-27)
        run: node apps/web/scripts/sbom.mjs --out /tmp/web.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-sbom
          path: /tmp/web.cdx.json
          if-no-files-found: error

  docker-image:
    # D-25: the third install type. The image is the one artefact whose content is decided entirely
    # outside the test suites - by the Dockerfile, the `.dockerignore` and what `npm install -g` of
    # the packed tarball produces - so it is built and started on every push, for linux/amd64 only
    # (the arm builds are emulated and belong to the tag). It has already caught the class of bug
    # that only shows up in a global install; see 6746180.
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build for linux/amd64, without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: homematic-manager:ci
          # `load: true` cannot take an image with attestations; the release workflow makes them
          provenance: false

      - name: It runs and knows its version
        run: docker run --rm homematic-manager:ci --version

      - name: It serves the UI
        run: |
          docker run -d --name hmm-ci -p 8090:8090 homematic-manager:ci --demo
          for _ in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' -L http://127.0.0.1:8090/ || echo 000)
            # `if`, not `&&`: the runner's shell has `set -e`, and a failing `&&` list would end
            # the step on the first attempt instead of waiting for the container to come up
            if [ "$code" = 200 ]; then break; fi
            sleep 1
          done
          docker logs hmm-ci
          docker rm -f hmm-ci
          # `--demo` redirects `/` to `/?demo`, hence -L; anything but 200 fails the job
          [ "$code" = 200 ]

      # D-27 wants a broken SBOM step found on a push and not at a tag, so the image SBOM is
      # generated here too - the release workflow does the same against the pushed digest.
      - name: SBOM of the image (D-27)
        uses: anchore/sbom-action@v0
        with:
          image: homematic-manager:ci
          format: cyclonedx-json
          output-file: /tmp/docker.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v7
        with:
          name: docker-sbom
          path: /tmp/docker.cdx.json
          if-no-files-found: error
