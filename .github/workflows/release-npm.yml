name: Release (npm package)

# One of the three independent release pipelines of D-24. This one publishes `apps/web` - the
# Homematic Manager server: the backend as an HTTP/WebSocket host with the built UI inside the
# tarball - to npm, and attaches the tarball and its SBOM to the GitHub release for a `v*` tag.
#
# It has no `needs:` on anything. The Electron app (`release-electron.yml`, task 11) and the CCU
# addon (`release-addon.yml`, task 13) run for the same tag in parallel, and a failure in either
# must never hold this one back or roll it back; re-running one alone is `workflow_dispatch` with
# the tag as its input.
#
# D-33: the package is `homematic-manager`, the name the 2.x desktop app had on npm, so what this
# workflow packs and publishes is `homematic-manager-<version>.tgz` and its SBOM is
# `homematic-manager-<version>.tgz.cdx.json`. The 1.x versions under that name stay deprecated; a
# deprecated version does not block a new one.
#
# Publishing uses npm **trusted publishing**: the `id-token: write` permission plus npm >= 11.5.1
# means the registry accepts an OIDC token from this workflow and no `NODE_AUTH_TOKEN` secret
# exists to be leaked. The trusted publisher is configured on npmjs.com for `homematic-manager`
# with repository `hobbyquaker/homematic-manager` and workflow **`release-npm.yml`** - renaming
# this file therefore breaks publishing with `ENEEDAUTH` until the publisher is updated, and an
# `ENEEDAUTH` here is the intended failure, not a reason to add a token secret.
#
# The GitHub release is created as a draft by whichever of the three workflows gets there first and
# published by the maintainer (see `release-electron.yml` for why).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, e.g. v3.0.0-beta.1
        required: true
        type: string

permissions:
  contents: write
  # trusted publishing (npm OIDC) and the two attestations of D-27
  id-token: write
  attestations: write

concurrency:
  # Per tag, not per branch: two runs for the same tag would race on the same version.
  group: release-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # trusted publishing needs npm >= 11.5.1; the one that ships with Node 24 is older
      - run: npm install -g npm@latest

      - run: npm ci

      # The tarball carries the built UI and the generated metadata (`scripts/prepack.mjs`), so
      # everything has to be built before anything is packed.
      - run: npm run build

      # the UI component tests run in Chromium (D-23); ci.yml has this step, this workflow lacked it
      # and the first beta publish failed on it
      - run: npx playwright install --with-deps chromium

      - run: npm test

      # `npm pack` writes its file list and the tarball details to stderr and only the file name to
      # stdout, so `tail -1` is the name - `homematic-manager-<version>.tgz`. Taken from npm rather
      # than spelled out here, so a version or a name never has to be kept in sync in two places.
      - name: Pack
        id: pack
        run: |
          mkdir -p dist-npm
          file=$(npm pack -w apps/web --pack-destination dist-npm | tail -1)
          echo "tarball=dist-npm/$file" >> "$GITHUB_OUTPUT"

      # D-27: the SBOM describes the tree the tarball really installs, bundled workspace packages
      # included - see apps/web/scripts/sbom.mjs. It runs against the tarball that is about to be
      # published, not against the repository.
      - name: SBOM (CycloneDX 1.6)
        run: node apps/web/scripts/sbom.mjs --tarball "${{ steps.pack.outputs.tarball }}"

      # Both attestations are made before anything is published or attached, so that a release
      # never carries a tarball whose provenance could not be signed. `gh attestation verify
      # <tarball> --repo hobbyquaker/homematic-manager` checks either of them offline.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
          sbom-path: ${{ steps.pack.outputs.tarball }}.cdx.json

      # `npm publish <tarball>` publishes exactly the artefact that was attested and packed above,
      # rather than packing a second, possibly different one. `--provenance` adds npm's own
      # provenance statement on top of the GitHub attestations.
      - name: Publish
        # A pre-release (3.0.0-dev.n, -alpha.n, -beta.n) goes out under the `next` dist-tag so
        # that `npm install -g homematic-manager` keeps giving whatever `latest` points at - which
        # until 3.0.0 is released is still the deprecated 2.x-era 1.0.14, with its deprecation
        # notice. Pre-release testers install `homematic-manager@next`. A plain version moves
        # `latest` and ends that.
        run: |
          # D-39 (maintainer, 2026-09-06): the 1.x versions under this name are dead, so a pre-release
          # is what `npm install -g homematic-manager` should give; it is published as `latest` and
          # additionally tagged `next`, so both spellings in the docs keep working.
          VERSION="$(node -p "require('./apps/web/package.json').version")"
          echo "publishing $VERSION as latest"
          npm publish "./${{ steps.pack.outputs.tarball }}" --provenance --access public --tag latest
          case "$VERSION" in
            *-*) npm dist-tag add "homematic-manager@$VERSION" next ;;
          esac

      - name: Attach the tarball and its SBOM to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.cdx.json
