# OpenCCU ships monit; the CCU3 firmware does not. Passive mode: monit restarts the addon when it
# dies, but never starts it at boot - run-parts does that (S98StartAddons), and starting it twice
# would leave two backends fighting over the same port and the same interface callbacks.
CHECK PROCESS hmm PIDFILE /var/run/hmm.pid
    GROUP hmm
    MODE PASSIVE
    ONREBOOT NOSTART

    start = "/usr/local/etc/config/rc.d/hmm start"
    stop = "/usr/local/etc/config/rc.d/hmm stop"
    restart = "/usr/local/etc/config/rc.d/hmm restart"

    if memory usage > 300 MB then alert
    if cpu > 80% for 3 cycles then alert
