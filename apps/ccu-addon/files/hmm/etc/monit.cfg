# OpenCCU ships monit; the CCU3 firmware does not.
#
# `MODE PASSIVE` plus `ONREBOOT NOSTART` because monit must never start this addon: run-parts does
# that (S98StartAddons), and a second backend would fight the first over the same port and the same
# interface callbacks. What monit is here for is the two alerts below.
#
# `ONREBOOT NOSTART` has a consequence that is easy to miss, and was missed until the lab measured
# it on 2026-09-05: monit leaves the check **unmonitored** whenever it starts or reloads, so
# `monit status hmm` said "Not monitored" on both OpenCCU boxes after a clean install and neither
# alert could ever have fired. `rc.d/hmm` therefore arms it (`monit -g hmm monitor`) after it has
# started the service and disarms it before it stops it - the same thing RedMatic does in
# `bin/monit-start`.
# The pidfile is inside the addon tree, not in /var/run: the CCU3 install chroot has no
# /var/run, see rc.d/hmm.
CHECK PROCESS hmm PIDFILE /usr/local/addons/hmm/var/hmm.pid
    GROUP hmm
    MODE PASSIVE
    ONREBOOT NOSTART

    start = "/usr/local/etc/config/rc.d/hmm start"
    stop = "/usr/local/etc/config/rc.d/hmm stop"
    restart = "/usr/local/etc/config/rc.d/hmm restart"

    if memory usage > 300 MB then alert
    if cpu > 80% for 3 cycles then alert
