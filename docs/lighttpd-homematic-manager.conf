# lighttpd in front of the Homematic Manager server (@homematic-manager/web).
#
# This is the reverse-proxy example for a Debian/LXC host - the deployment of docs/install-lxc.md.
# The CCU addon of task 13 installs a rule of its own shape as
# /usr/local/etc/config/lighttpd/hmm.conf; the mechanism is the same and is proven on the CCU3 and
# OpenCCU by RedMatic, whose Node-RED editor talks WebSocket through exactly this.
#
# Install as /etc/lighttpd/conf-available/50-homematic-manager.conf, then:
#
#     lighttpd-enable-mod proxy
#     lighttpd-enable-mod homematic-manager
#     systemctl reload lighttpd
#
# Start the backend behind it with:
#
#     homematic-manager-web --base /hmm/ --host 127.0.0.1 --no-issue-cookie --token "$TOKEN"
#
# --base makes the UI, the images, the metadata *and* the API socket live under the prefix, and the
# UI needs no rebuild for it: it is built with `base: './'` and derives the socket URL from the
# page's own directory.

server.modules += ( "mod_proxy" )

$HTTP["url"] =~ "^/hmm/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8090 )) )

    # The one line that matters. Without it lighttpd answers the WebSocket upgrade itself and the
    # UI never connects: mod_proxy passes `Connection: Upgrade` through only when this is set.
    # Needs lighttpd >= 1.4.46.
    proxy.header = ( "upgrade" => "enable" )

    # An idle socket must not be cut. The server pings every idle API socket every 25 s,
    # which is below the 60 s default of both of these - they are spelled out because a hardened
    # lighttpd.conf often lowers them.
    server.max-read-idle = 90
    server.max-write-idle = 90

    # Optional: HTTP basic authentication in front of everything.
    #
    # It is *in addition to* the backend's token, never instead of it. The proxy decides who may
    # reach the port; the token decides who may open the API socket, and it still has to get to the
    # browser - either with --issue-cookie (the proxy is then the only thing guarding the app) or
    # from something that checked the session, the way the addon's settings.cgi does.
    #
    #   auth.backend = "htpasswd"
    #   auth.backend.htpasswd.userfile = "/etc/lighttpd/homematic-manager.htpasswd"
    #   auth.require = ( "" => (
    #       "method"  => "basic",
    #       "realm"   => "Homematic Manager",
    #       "require" => "valid-user"
    #   ))
}

# TLS is terminated here, not in the backend - the host speaks plain HTTP and always will.
#
# With TLS on, the cookie the token travels in should carry `Secure`, which the backend only sets
# when it issues the cookie itself over https; behind a proxy that terminates TLS the backend
# cannot know, so let whatever issues the cookie set the flag. Nothing else about this file changes:
# a WebSocket over a TLS-terminating lighttpd is `wss://` to the browser and plain `ws://` upstream.
#
#   $SERVER["socket"] == ":443" {
#       ssl.engine  = "enable"
#       ssl.pemfile = "/etc/lighttpd/certs/homematic-manager.pem"
#       # include the block above here, or keep it global as it is
#   }
