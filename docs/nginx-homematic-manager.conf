# nginx in front of the Homematic Manager server (@homematic-manager/web).
#
# The lighttpd equivalent, with the same two requirements: the WebSocket upgrade has to be passed
# through, and an idle socket must not be closed for being idle.
#
# Install as /etc/nginx/sites-available/homematic-manager, symlink it into sites-enabled, then
# `nginx -t && systemctl reload nginx`. Start the backend with:
#
#     homematic-manager-web --base /hmm/ --host 127.0.0.1 --no-issue-cookie --token "$TOKEN"

# `Connection` must be "upgrade" for an upgrade request and empty otherwise - a hop-by-hop header
# that is copied blindly breaks keep-alive for every ordinary request. This map belongs in the
# `http` block, once per server, not inside `server`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name homematic-manager.example.lan;

    # The prefix has to match --base. `proxy_pass` without a trailing path keeps the URI as it is,
    # which is what the backend wants: it serves everything under the prefix itself.
    location /hmm/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The host pings an idle API socket every 25 s, so the default 60 s would be survivable -
        # but a socket that is quiet while a long paramset write runs should not be cut either.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Device pictures and the generated metadata are up to a few hundred KB; nginx buffers
        # them happily. The API socket is unbuffered by virtue of being an upgrade.
    }

    # Optional: HTTP basic authentication in front of everything. It is *in addition to* the
    # backend's token, never instead of it - the proxy decides who reaches the port, the token
    # decides who may open the API socket.
    #
    #   auth_basic "Homematic Manager";
    #   auth_basic_user_file /etc/nginx/homematic-manager.htpasswd;
}

# TLS is terminated here; the backend speaks plain HTTP and always will. A WebSocket through a
# TLS-terminating nginx is `wss://` to the browser and plain `ws://` upstream - nothing in the
# location block changes.
